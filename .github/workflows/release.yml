name: Automatic Release

on:
  push:
    tags:
      - 'v*.*.*'  # Запуск при создании тега версии (например, v2.2.0)

jobs:
  build-and-release:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Build executable
      run: |
        pyinstaller --onefile --windowed --name="Sims4-Mod-Installer" --icon=icon.ico sims4_mod_installer.py
        
    - name: Create ZIP package
      run: |
        mkdir release
        copy Sims4-Mod-Installer.exe release/
        copy README.md release/
        copy MEGA_UPDATE_GUIDE.md release/
        copy requirements.txt release/
        copy *.py release/  # Копируем исходники для разработки
        7z a sims4-mod-installer-${{ github.ref_name }}.zip release/
        
    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        release_name: Sims 4 Mod Installer ${{ github.ref_name }}
        body: |
          ## Новая версия Sims 4 Mod Installer ${{ github.ref_name }}
          
          ### 🚀 Что нового:
          - Автоматические обновления через GitHub Releases
          - Расширенная поддержка форматов файлов
          - Настоящий drag-and-drop
          - Уникальные токены устройств
          - Режим технических работ
          
          ### 📦 Установка:
          1. Скачайте `sims4-mod-installer-${{ github.ref_name }}.zip`
          2. Распакуйте архив
          3. Запустите `Sims4-Mod-Installer.exe`
          
          ### ⚙️ Для разработчиков:
          - Исходный код включен в архив
          - Требования в файле `requirements.txt`
          - Документация в `MEGA_UPDATE_GUIDE.md`
          
          ### 🔧 Обновления:
          Программа автоматически проверяет обновления при запуске.
          
          ---
          **Версия:** ${{ github.ref_name }}  
          **Дата:** ${{ github.event.head_commit.timestamp }}
        draft: false
        prerelease: false
        
    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./sims4-mod-installer-${{ github.ref_name }}.zip
        asset_name: sims4-mod-installer-${{ github.ref_name }}.zip
        asset_content_type: application/zip
